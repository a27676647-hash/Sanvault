<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SanVault — Hisab Kitab</title>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #faf7f2;
    --line: #ddd5c7;
    --gold: #b8862e;
    --green: #2f6f4f;
    --red: #a5432f;
    --muted: #8a8172;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Noto Sans Devanagari', serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    padding: 28px 20px 18px;
    border-bottom: 2px solid var(--ink);
  }
  header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  header .tag {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 4px;
  }
  .balance-row {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
  }
  .balance-card {
    flex: 1;
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .balance-card .label {
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .balance-card .amt { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .amt.green { color: var(--green); }
  .amt.red { color: var(--red); }

  .input-area {
    margin: 8px 20px 20px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .input-area textarea {
    width: 100%;
    border: none;
    font-family: -apple-system, sans-serif;
    font-size: 16px;
    resize: none;
    outline: none;
    min-height: 44px;
  }
  .hint {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button {
    font-family: -apple-system, sans-serif;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-in { background: var(--green); color: white; flex: 1; }
  .btn-out { background: var(--red); color: white; flex: 1; }
  .btn-in:disabled, .btn-out:disabled { opacity: 0.5; }

  .list { margin: 0 20px 40px; }
  .list h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    margin-bottom: 10px;
  }
  .entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .entry .note { font-size: 15px; }
  .entry .cat {
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .entry .val { font-weight: 700; font-family: -apple-system, sans-serif; }
  .empty {
    text-align: center;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    padding: 30px 0;
    font-size: 14px;
  }
  .loading { color: var(--gold); font-style: italic; }
</style>
</head>
<body>

<header style="display:flex; justify-content:space-between; align-items:flex-start;">
  <div>
    <h1>SanVault</h1>
    <div class="tag">Smart Hisab-Kitab · AI se Auto-Categorize</div>
  </div>
  <select id="currencySelect" style="font-family:-apple-system,sans-serif; font-size:13px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:white; height:32px;">
    <option value="₨">₨ PKR</option>
    <option value="₹">₹ INR</option>
    <option value="$">$ USD</option>
    <option value="£">£ GBP</option>
    <option value="€">€ EUR</option>
    <option value="AED">AED</option>
  </select>
</header>

<div class="balance-row">
  <div class="balance-card">
    <div class="label">Aaya (In)</div>
    <div class="amt green" id="totalIn">₹0</div>
  </div>
  <div class="balance-card">
    <div class="label">Gaya (Out)</div>
    <div class="amt red" id="totalOut">₹0</div>
  </div>
  <div class="balance-card">
    <div class="label">Balance</div>
    <div class="amt" id="balance">₹0</div>
  </div>
</div>

<div class="input-area">
  <textarea id="entryText" placeholder="Jaise: '500 chai ke liye diye' ya 'received 2000 from Ramesh'"></textarea>
  <div class="hint" id="statusHint">Hindi, English, ya dono mix mein likh sakte hain — AI khud samajh lega.</div>
  <div class="actions">
    <button class="btn-in" id="addIn">+ Paisa Aaya</button>
    <button class="btn-out" id="addOut">− Paisa Gaya</button>
  </div>
</div>

<div class="list">
  <h2>Recent Entries</h2>
  <div id="entryList"></div>
</div>

<script>
let entries = [];
let currency = '₨';

async function loadEntries() {
  try {
    const raw = localStorage.getItem('sanvault-entries');
    entries = raw ? JSON.parse(raw) : [];
    const savedCurrency = localStorage.getItem('sanvault-currency');
    if (savedCurrency) currency = savedCurrency;
    document.getElementById('currencySelect').value = currency;
  } catch (e) {
    entries = [];
  }
  render();
}

document.getElementById('currencySelect').addEventListener('change', (e) => {
  currency = e.target.value;
  localStorage.setItem('sanvault-currency', currency);
  render();
});

async function saveEntries() {
  try {
    localStorage.setItem('sanvault-entries', JSON.stringify(entries));
  } catch (e) {
    console.error('Save failed', e);
  }
}

async function categorize(text, entryType) {
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: `You are a categorizer for a South Asian expense/income tracker used across Pakistan, India, and elsewhere. The user wrote this entry (may be in Urdu, Hindi, English, or a mix): "${text}"
Entry type given by user: "${entryType}" (either "income" or "expense").

Respond ONLY with JSON, no markdown, no preamble, in this exact shape:
{"amount": <number>, "note": "<short clean description, 4-6 words, same language style as input>", "category": "<one word category>"}

Category rules:
- If entry type is "income", pick from: Salary, Business Income, Received Payment, Gift, Other Income
- If entry type is "expense", pick from: Food, Travel, Rent, Bills, Shopping, Health, Education, Other Expense

If no clear amount is found, use 0.`
        }]
      })
    });
    const data = await response.json();
    const text2 = data.content.map(b => b.text || "").join("");
    const clean = text2.replace(/```json|```/g, "").trim();
    return JSON.parse(clean);
  } catch (e) {
    return { amount: 0, note: text, category: "Other" };
  }
}

async function addEntry(type) {
  const textarea = document.getElementById('entryText');
  const text = textarea.value.trim();
  if (!text) return;

  const hint = document.getElementById('statusHint');
  hint.textContent = "AI samajh raha hai...";
  hint.classList.add('loading');
  document.getElementById('addIn').disabled = true;
  document.getElementById('addOut').disabled = true;

  const parsed = await categorize(text, type === 'in' ? 'income' : 'expense');

  entries.unshift({
    id: Date.now(),
    type: type,
    amount: parsed.amount || 0,
    note: parsed.note || text,
    category: parsed.category || (type === 'in' ? 'Other Income' : 'Other Expense'),
    date: new Date().toLocaleDateString('en-GB')
  });

  textarea.value = '';
  hint.textContent = "Hindi, English, ya dono mix mein likh sakte hain — AI khud samajh lega.";
  hint.classList.remove('loading');
  document.getElementById('addIn').disabled = false;
  document.getElementById('addOut').disabled = false;

  await saveEntries();
  render();
}

function render() {
  let totalIn = 0, totalOut = 0;
  entries.forEach(e => {
    if (e.type === 'in') totalIn += e.amount;
    else totalOut += e.amount;
  });
  document.getElementById('totalIn').textContent = currency + totalIn.toLocaleString('en-US');
  document.getElementById('totalOut').textContent = currency + totalOut.toLocaleString('en-US');
  const bal = totalIn - totalOut;
  const balEl = document.getElementById('balance');
  balEl.textContent = currency + bal.toLocaleString('en-US');
  balEl.className = 'amt ' + (bal >= 0 ? 'green' : 'red');

  const list = document.getElementById('entryList');
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty">Abhi tak koi entry nahi. Upar likh kar shuru karein.</div>';
    return;
  }
  list.innerHTML = entries.map(e => `
    <div class="entry">
      <div>
        <div class="note">${e.note}</div>
        <div class="cat">${e.category} · ${e.date}</div>
      </div>
      <div class="val" style="color: ${e.type === 'in' ? 'var(--green)' : 'var(--red)'}">
        ${e.type === 'in' ? '+' : '−'}${currency}${e.amount.toLocaleString('en-US')}
      </div>
    </div>
  `).join('');
}

document.getElementById('addIn').addEventListener('click', () => addEntry('in'));
document.getElementById('addOut').addEventListener('click', () => addEntry('out'));

loadEntries();
</script>

</body>
</html>
